<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - StudyHub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background: #F8FAFC;

            color: #1F2937;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;

            padding: 38px;

            background: #FFFFFF;

            border:
                1px solid #E2E8F0;

            border-radius: 22px;

            box-shadow:
                0 20px 55px
                rgba(
                    30,
                    58,
                    95,
                    0.12
                );
        }

        .brand {
            text-align: center;

            margin-bottom: 28px;
        }

        .brand-icon {
            width: 62px;
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 14px;

            border-radius: 17px;

            background: #DBEAFE;

            font-size: 30px;
        }

        .brand h1 {
            margin: 0;

            color: #1E3A5F;

            font-size: 30px;
            font-weight: 800;
        }

        .brand p {
            margin: 7px 0 0;

            color: #64748B;

            font-size: 14px;
        }

        .message {
            padding: 12px 14px;

            margin-bottom: 17px;

            border-radius: 10px;

            font-size: 13px;
        }

        .message.error {
            background: #FEF2F2;

            color: #991B1B;

            border:
                1px solid #FECACA;
        }

        .message.success {
            background: #F0FDF4;

            color: #166534;

            border:
                1px solid #BBF7D0;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #1E3A5F;

            font-size: 13px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            outline: none;

            border:
                1px solid #E2E8F0;

            border-radius: 11px;

            background: #FFFFFF;

            color: #1F2937;

            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #3B82F6;

            box-shadow:
                0 0 0 3px
                rgba(
                    59,
                    130,
                    246,
                    0.10
                );
        }

        .register-button {
            width: 100%;

            padding: 13px 16px;

            border: none;

            border-radius: 11px;

            background: #1E3A5F;

            color: #FFFFFF;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }

        .register-button:hover {
            background: #17304E;
        }

        .footer-text {
            margin-top: 21px;

            text-align: center;

            color: #64748B;

            font-size: 13px;
        }

        .footer-text a {
            color: #3B82F6;

            font-weight: 700;

            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {

            .auth-card {
                padding: 28px 22px;
            }

            .brand h1 {
                font-size: 27px;
            }

        }

    </style>

</head>

<body>

    <div class="auth-card">

        <div class="brand">

            <div class="brand-icon">
                📚
            </div>

            <h1>
                Create Account
            </h1>

            <p>
                Start organizing your study resources
            </p>

        </div>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('auth.register') }}"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    minlength="3"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 6 characters"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter password again"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-button"
            >
                Create Account
            </button>

        </form>


        <div class="footer-text">

            Already have an account?

            <a
                href="{{ url_for('auth.login') }}"
            >
                Login
            </a>

        </div>

    </div>

</body>

</html>
